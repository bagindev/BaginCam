# XcodeGen spec -> ModKamera.xcodeproj dibuat otomatis di GitHub Actions (macOS).
# Tidak perlu Mac/Xcode lokal. Lihat .github/workflows/ios-build.yml
name: ModKamera
options:
  bundleIdPrefix: dev.modkamera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ModKamera:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ModKamera
        excludes:
          - "LUTs/**"
      - path: ModKamera/LUTs
        type: folder          # folder reference -> ikut ke bundle sebagai folder "LUTs"
    info:
      path: ModKamera/Info.plist
      properties:
        CFBundleDisplayName: ModKamera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: ModKamera butuh kamera untuk memotret.
        NSPhotoLibraryAddUsageDescription: ModKamera menyimpan foto RAW ke galeri.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.modkamera.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
