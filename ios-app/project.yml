# XcodeGen spec -> BaginCam.xcodeproj dibuat otomatis di GitHub Actions (macOS).
# Tidak perlu Mac/Xcode lokal. Lihat .github/workflows/ios-build.yml
name: BaginCam
options:
  bundleIdPrefix: dev.bagincam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "10"
targets:
  BaginCam:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: BaginCam
        excludes:
          - "LUTs/**"
          - "Models/**"
      - path: BaginCam/LUTs
        type: folder          # folder reference -> ikut ke bundle sebagai folder "LUTs"
      - path: BaginCam/Models
        type: folder          # model Core ML terkompilasi (.mlmodelc) -> folder "Models"
    info:
      path: BaginCam/Info.plist
      properties:
        CFBundleDisplayName: BaginCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: BaginCam butuh kamera untuk memotret.
        NSPhotoLibraryAddUsageDescription: BaginCam menyimpan foto RAW ke galeri.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bagincam.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
