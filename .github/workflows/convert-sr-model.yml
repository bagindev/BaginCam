name: Convert SR model (Core ML)

# Konversi Real-ESRGAN -> Core ML (.mlpackage) lalu compile -> .mlmodelc.
#   Cepat : realesr-general-x4v3 (SRVGGNetCompact, 1.2 M param)
#   Detail: RealESRGAN_x4plus    (RRDBNet, 16.7 M param)
# Hasil .mlmodelc di-commit ke ios-app/BaginCam/Models/.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sr_model/**"
      - ".github/workflows/convert-sr-model.yml"

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install torch + coremltools
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1" "coremltools==8.3.0" "numpy==1.26.4" pillow

      - name: Download weights (Real-ESRGAN, BSD-3-Clause) + cek SHA-256
        run: |
          curl -fsSL -o realesr-general-x4v3.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -fsSL -o RealESRGAN_x4plus.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          cat > sums.txt <<'EOF'
          8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292  realesr-general-x4v3.pth
          4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1  RealESRGAN_x4plus.pth
          EOF
          sed -i '' 's/^ *//' sums.txt
          shasum -a 256 -c sums.txt

      - name: Convert + verify (Cepat)
        run: python tools/sr_model/convert_sr.py realesr-general-x4v3.pth --arch compact --out BaginCamSR_x4_256.mlpackage

      - name: Convert + verify (Detail)
        run: python tools/sr_model/convert_sr.py RealESRGAN_x4plus.pth --arch rrdb --out BaginCamSRplus_x4_256.mlpackage

      - name: Compile mlmodelc
        run: |
          mkdir -p out
          xcrun coremlcompiler compile BaginCamSR_x4_256.mlpackage out/
          xcrun coremlcompiler compile BaginCamSRplus_x4_256.mlpackage out/
          du -sh out/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BaginCamSR-coreml
          path: out/
          retention-days: 30
