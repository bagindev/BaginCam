name: Convert SR model (Core ML)

# Konversi Real-ESRGAN realesr-general-x4v3 -> Core ML (.mlpackage) lalu compile -> .mlmodelc.
# Dijalankan manual. Hasil .mlmodelc di-commit ke ios-app/BaginCam/Models/.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sr_model/**"
      - ".github/workflows/convert-sr-model.yml"

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install torch + coremltools
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1" "coremltools==8.3.0" "numpy==1.26.4" pillow

      - name: Download weights (Real-ESRGAN v0.2.5.0, BSD-3-Clause)
        run: |
          curl -fsSL -o realesr-general-x4v3.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          shasum -a 256 realesr-general-x4v3.pth
          echo "8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292  realesr-general-x4v3.pth" | shasum -a 256 -c

      - name: Convert + verify
        run: python tools/sr_model/convert_sr.py realesr-general-x4v3.pth --out BaginCamSR_x4_256.mlpackage

      - name: Compile mlmodelc
        run: |
          mkdir -p out
          xcrun coremlcompiler compile BaginCamSR_x4_256.mlpackage out/
          du -sh out/BaginCamSR_x4_256.mlmodelc
          find out -type f | head -20

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BaginCamSR-coreml
          path: |
            out/BaginCamSR_x4_256.mlmodelc
            BaginCamSR_x4_256.mlpackage
          retention-days: 30
